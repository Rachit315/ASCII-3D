<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="planet-grad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="50%" stop-color="#fb8500" />
      <stop offset="100%" stop-color="#d62828" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48cae4" />
      <stop offset="50%" stop-color="#90e0ef" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
  </defs>

  <!-- Back Ring Arc -->
  <path d="M 60 270 C 50 200 120 160 250 160 C 380 160 450 200 440 270 C 430 240 370 200 250 200 C 130 200 70 240 60 270 Z" fill="url(#ring-grad)" />

  <!-- Planet Body -->
  <circle cx="250" cy="250" r="140" fill="url(#planet-grad)" />

  <!-- Planet Surface Stripes / Details -->
  <path d="M 125 210 Q 250 240 375 210 Q 380 235 370 245 Q 250 275 130 245 Z" fill="#b7094c" opacity="0.8" />
  <path d="M 140 280 Q 250 315 360 280 Q 345 305 320 320 Q 250 345 180 320 Z" fill="#6930c3" opacity="0.6" />

  <!-- Front Ring Arc -->
  <path d="M 50 270 C 70 340 150 380 250 380 C 350 380 430 340 450 270 C 430 310 360 340 250 340 C 140 340 70 310 50 270 Z" fill="url(#ring-grad)" />

  <!-- Distant Stars -->
  <polygon points="100,90 105,105 120,110 105,115 100,130 95,115 80,110 95,105" fill="#ffffff" />
  <polygon points="400,100 403,112 415,115 403,118 400,130 397,118 385,115 397,112" fill="#ffd166" />
  <polygon points="380,390 383,400 393,403 383,406 380,416 377,406 367,403 377,400" fill="#06d6a0" />
</svg>
